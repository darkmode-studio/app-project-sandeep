<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Settings</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f2f2f7; margin: 0; padding: 0; }
        .header { font-size: 34px; font-weight: bold; padding: 20px 16px 10px; background: #f2f2f7; }
        .section { background: #fff; margin: 20px 16px; border-radius: 10px; overflow: hidden; }
        .row { padding: 12px 16px; font-size: 17px; border-bottom: 1px solid #e5e5ea; display: flex; justify-content: space-between; align-items: center; }
        .row:last-child { border-bottom: none; }
        .row-title { display: flex; align-items: center; gap: 12px; }
        .icon { width: 28px; height: 28px; border-radius: 6px; display: inline-block; }
    </style>
</head>
<body>
    <div class="header">Settings</div>
    <div class="section">
        <div class="row">
            <div class="row-title"><div class="icon" style="background: #007aff;"></div> Wi-Fi</div>
            <span style="color: #8e8e93;">Not Connected</span>
        </div>
        <div class="row">
            <div class="row-title"><div class="icon" style="background: #34c759;"></div> Cellular</div>
            <span style="color: #8e8e93;">Setup</span>
        </div>
    </div>
</body>
</html>
